<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
    content="Lead Product Designer with 10+ years of experience in UX/UI, enterprise SaaS, and design systems. Specializing in accessible, data-driven product design and game UI. Based in Chicago, open to remote roles.">
  <meta name="keywords" content="UX/UI Designer, Design Systems Designer, Enterprise UX Designer,
                                  Game UI Designer, Game UX Designer, Figma Expert,
                                  Accessibility Design, WCAG Compliance, UX Strategy,
                                  SaaS Product Design, B2B UX, Chicago Product Designer, Remote UX Designer
                                  ">
    <title>B's Journal</title>
    <link rel="shortcut icon" href="../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/module.css" />
    <link rel="stylesheet" href="../assets/css/state.css" />
    <link rel="stylesheet" href="../assets/css/journal-gallery.css" />
  </head>
  <body>

    <div id="nav-mount"></div>

    <!-- ═══════════════════════════════════════════════════════
       FRAME BORDERS — Desktop chrome effect
  ════════════════════════════════════════════════════════ -->
    <div class="FrameBorder--top"></div>
    <div class="FrameBorder--bottom"></div>
    <div class="FrameBorder--right"></div>

    <!-- ═══════════════════════════════════════════════════════
       MAIN CONTENT
  ════════════════════════════════════════════════════════ -->
    <main id="main-content" class="MainContent">
      <div class="ContentWrapper">
        <div class="PageContent">
          <!-- ─── Page Header ────────────────────────────────── -->
          <section class="SubpageHeader">
            <h1 class="HeroSection-heading">
              My
              <span class="DisplayEmphasis-wrapper">
                <span class="DisplayEmphasis">
                  <span class="DisplayEmphasis-word">thoughts</span>
                  <span class="DisplayEmphasis-border">
                    <span class="DisplayEmphasis-stroke"></span>
                    <span
                      class="DisplayEmphasis-corner DisplayEmphasis-corner--tl"
                    ></span>
                    <span
                      class="DisplayEmphasis-corner DisplayEmphasis-corner--tr"
                    ></span>
                    <span
                      class="DisplayEmphasis-corner DisplayEmphasis-corner--bl"
                    ></span>
                    <span
                      class="DisplayEmphasis-corner DisplayEmphasis-corner--br"
                    ></span>
                  </span>
                </span>
                <span class="DisplayEmphasis-cursor slide-right">
                  <img
                    src="../assets/img/Vector.svg"
                    alt=""
                    width="28"
                    height="28"
                  />
                </span>
              </span>
            </h1>
          </section>

          <!-- ═══════════════════════════════════════════════════════
            Recent Entries
          ════════════════════════════════════════════════════════ -->
          <section class="RecentSection-container2columns">
            <div class="CategoryDivider">
              <span class="CategoryDivider-label">
                <span class="CategoryDivider-corner CategoryDivider-corner--tl"></span>
                <span class="CategoryDivider-corner CategoryDivider-corner--tr"></span>
                <span class="CategoryDivider-corner CategoryDivider-corner--bl"></span>
                <span class="CategoryDivider-corner CategoryDivider-corner--br"></span>
                <p>Recent entries</p>
              </span>
              <span class="CategoryDivider-line" aria-hidden="true"></span>
            </div>

            <ul
              class="journal-grid recent-entries-grid"
              id="recent-entries-grid"
              aria-label="Three most recent journal entries"
            ></ul>
          </section>

          <!-- ═══════════════════════════════════════════════════════
            All Entries
          ════════════════════════════════════════════════════════ -->

          <section class="Section">
            <section class="gallery" aria-labelledby="gallery-heading">
              <!-- Controls: filters + view toggle -->
              <div class="gallery__controls">
                <!-- Two-tier tab filter -->
                <div class="gallery-tabs" id="gallery-tabs">
                  <!-- Tier 1 — Category tabs -->
                  <div
                    class="gallery-tabs__tier1"
                    id="gallery-tier1"
                    role="tablist"
                    aria-label="Filter by category"
                  >
                    <button
                      class="gtab"
                      role="tab"
                      aria-selected="true"
                      tabindex="0"
                      data-category="all"
                      id="gtab-all"
                    >
                      <span class="gtab__chip" aria-hidden="true">
                        <svg
                          viewBox="0 0 14 14"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <rect x="1" y="1" width="5" height="5" rx="0.5" />
                          <rect x="8" y="1" width="5" height="5" rx="0.5" />
                          <rect x="1" y="8" width="5" height="5" rx="0.5" />
                          <rect x="8" y="8" width="5" height="5" rx="0.5" />
                        </svg>
                      </span>
                      All
                    </button>

                    <button
                      class="gtab"
                      role="tab"
                      aria-selected="false"
                      tabindex="-1"
                      data-category="process"
                      id="gtab-process"
                    >
                      <span class="gtab__chip" aria-hidden="true">
                        <svg
                          viewBox="0 0 14 14"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <path d="M2 11 L7 2 L12 11 Z" />
                        </svg>
                      </span>
                      Process
                    </button>

                    <button
                      class="gtab"
                      role="tab"
                      aria-selected="false"
                      tabindex="-1"
                      data-category="reflection"
                      id="gtab-reflection"
                    >
                      <span class="gtab__chip" aria-hidden="true">
                        <svg
                          viewBox="0 0 14 14"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <circle cx="7" cy="7" r="4.5" />
                        </svg>
                      </span>
                      Reflection
                    </button>
                  </div>

                  <!-- Tier 2 — Subtab row (JS-populated, hidden until a category with subtabs is active) -->
                  <div
                    class="gallery-tabs__tier2"
                    id="gallery-tier2"
                    role="tablist"
                    aria-label="Filter by subcategory"
                  >
                    <!-- Injected by JS -->
                  </div>
                </div>
                <!-- /gallery-tabs -->

                <!-- View toggle pill -->
                <div
                  class="view-toggle"
                  role="group"
                  aria-label="Change gallery view"
                >
                  <button
                    class="view-toggle__btn"
                    id="btn-grid"
                    aria-pressed="true"
                    aria-label="Grid view"
                    data-view="grid"
                  >
                    <svg
                      viewBox="0 0 16 16"
                      fill="none"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <rect
                        x="1"
                        y="1"
                        width="6"
                        height="6"
                        rx="1"
                        fill="currentColor"
                      />
                      <rect
                        x="9"
                        y="1"
                        width="6"
                        height="6"
                        rx="1"
                        fill="currentColor"
                      />
                      <rect
                        x="1"
                        y="9"
                        width="6"
                        height="6"
                        rx="1"
                        fill="currentColor"
                      />
                      <rect
                        x="9"
                        y="9"
                        width="6"
                        height="6"
                        rx="1"
                        fill="currentColor"
                      />
                    </svg>
                    grid
                  </button>
                  <button
                    class="view-toggle__btn"
                    id="btn-list"
                    aria-pressed="false"
                    aria-label="List view"
                    data-view="list"
                  >
                    <svg
                      viewBox="0 0 16 16"
                      fill="none"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <rect
                        x="1"
                        y="2"
                        width="14"
                        height="3"
                        rx="1"
                        fill="currentColor"
                      />
                      <rect
                        x="1"
                        y="7"
                        width="14"
                        height="3"
                        rx="1"
                        fill="currentColor"
                      />
                      <rect
                        x="1"
                        y="12"
                        width="14"
                        height="3"
                        rx="1"
                        fill="currentColor"
                      />
                    </svg>
                    list
                  </button>
                </div>
              </div>
              <!-- /gallery__controls -->

              <!-- Card list -->
              <ul
                class="journal-grid"
                id="journal-grid"
                data-view="grid"
                aria-label="journal gallery"
                aria-live="polite"
                aria-atomic="false"
              >
                <!-- Cards injected by journal-gallery.js from journal-data.js -->
              </ul>
            </section>
          </section>
        </div>

        <!-- Footer -->
        <footer id="footer-content" class="FooterContent">
          <hr />
          <p class="FooterCopy">
            <strong>Designed with care</strong>
            B the Designer © 2026. All Rights Reserved. •
            <a href="#">Terms of Use</a>
          </p>
        </footer>
      </div>
    </main>

    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/journal-data.js"></script>
    <script src="../assets/js/nav-loader.js"></script>
    <script src="../assets/js/journal-gallery.js"></script>

    <!-- Loads anime.js and wires the FLIP layout engine.
       Must be type="module" for the import to work.
       Runs after journal-gallery.js so window._galleryLayout is ready when needed. -->
    <script type="module">
      import {
        createLayout,
        utils,
        stagger,
      } from "https://esm.sh/animejs@4.3.0";

      const $grid = document.getElementById("journal-grid");
      if ($grid) {
        const cardsLayout = createLayout($grid, {
          properties: ["font-size"],
          enterFrom: {
            opacity: (el) =>
              el.classList.contains("journal-card") ? "1" : "0",
            transform: (el) =>
              el.classList.contains("journal-card")
                ? "translateY(60%) scale(.85)"
                : "none",
          },
          leaveTo: {
            opacity: 0,
            transform: (el) => {
              if (!el.classList.contains("journal-card")) return "none";
              const i = [...el.parentElement.children].indexOf(el);
              const d = i % 2 ? -1 : 1;
              return `translate(${30 * d}%, 30%) rotate(${10 * d}deg) scale(.85)`;
            },
          },
        });

        // Expose on window so journal-gallery.js can use it for animated view switching
        window._galleryLayout = { cardsLayout, utils, stagger };
      }
    </script>
  </body>
</html>
