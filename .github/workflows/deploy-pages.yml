# Deploys the website to GitHub Pages, leaving out development-only files
# (Storybook, package files, README, etc.).
#
# Requires: repo Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Copy everything except dev-only files into _site.
      # New site folders are included automatically — add to this list
      # only when you add a new dev-only file or folder.
      - name: Assemble site files
        run: |
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.hintrc' \
            --exclude '.DS_Store' \
            --exclude 'node_modules' \
            --exclude 'storybook' \
            --exclude 'storybook-static' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'README.md' \
            --exclude '*.log' \
            --exclude '_site'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
